<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administración · Expedición a Roma</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-page"><main class="login-wrap"><a class="back-link" href="{{ url_for('home') }}">← Volver a Expedición a Roma</a><section class="login-card"><span class="brand-mark large">R</span><div class="section-kicker">ZONA PRIVADA</div><h1>Panel de administración</h1><p>Introduce tu contraseña para gestionar las inscripciones.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Contraseña<input type="password" name="password" required autocomplete="current-password"></label><button class="btn btn-dark" type="submit">Entrar al panel →</button></form></section></main></body></html>
